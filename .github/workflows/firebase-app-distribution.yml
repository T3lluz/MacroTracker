name: Firebase App Distribution

# Legacy Expo-era workflow. DailyDash now publishes tester APKs via
# `.github/workflows/build-apk.yml` (GitHub Releases) and the in-app updater.
# Kept disabled so old secrets/triggers do not fail CI.

on:
  workflow_dispatch:

jobs:
  deprecated:
    name: Deprecated — use Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "Firebase App Distribution CI for this repo is deprecated."
          echo "Use workflow 'Build & Release APK' (merge to master, tag v*, or workflow_dispatch)."
          echo "The app checks GitHub Releases for updates in-app."
          exit 1
