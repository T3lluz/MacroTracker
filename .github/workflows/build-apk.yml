name: Build & Release APK

# Publishes a tester APK to GitHub Releases on master merges (and manual runs).
# In-app updates require a higher versionCode and the asset name:
#   DailyDash-{versionName}-vc{versionCode}.apk

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes shown in-app and on GitHub."
        required: false

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

jobs:
  release:
    name: Build and publish DailyDash APK
    runs-on: ubuntu-latest
    # Skip the follow-up commit that only bumps versionCode/versionName.
    if: >
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Only platforms + build-tools are needed for assembleRelease.
      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-api36-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-api36-
            android-sdk-${{ runner.os }}-

      - name: Ensure unique version
        id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ensure-unique-version.sh

      - name: Build release APK
        run: ./gradlew assembleRelease --build-cache

      - name: Package release
        id: package
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          COMMIT_SHA: ${{ steps.version.outputs.commit_sha || github.sha }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/package-release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.name }}
          body: ${{ steps.package.outputs.notes }}
          files: ${{ steps.package.outputs.apk }}
          # Notes are composed in package-release.sh (precise bullets + working links).
          generate_release_notes: false
          target_commitish: ${{ steps.version.outputs.commit_sha || github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
