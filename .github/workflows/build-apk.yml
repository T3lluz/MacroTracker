name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.1.3). Leave empty to auto-generate."
        required: false
      release_name:
        description: "Optional release name shown on GitHub Releases."
        required: false
      release_notes:
        description: "Release notes shown in-app and on GitHub."
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build and publish DailyDash APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK (tester signing)
        run: ./gradlew assembleDebug --no-daemon

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            RELEASE_NAME="${{ github.event.inputs.release_name }}"
          else
            RELEASE_NAME="DailyDash ${VERSION_NAME} (build ${VERSION_CODE})"
          fi

          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            NOTES="DailyDash ${VERSION_NAME} (build ${VERSION_CODE})

Installs as an in-app update when signed with the shared tester keystore.
Bump versionCode in app/build.gradle.kts before each tester push."
          fi

          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "No debug APK found" >&2
            exit 1
          fi

          # Filename contract parsed by AppUpdateRepository:
          # DailyDash-{versionName}-vc{versionCode}.apk
          APK_NAME="DailyDash-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp "$APK_SRC" "$APK_NAME"

          {
            echo "tag=${TAG_NAME}"
            echo "name=${RELEASE_NAME}"
            echo "apk=${APK_NAME}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"

          # Multiline notes
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dailydash-apk
          path: ${{ steps.meta.outputs.apk }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.notes }}
          files: ${{ steps.meta.outputs.apk }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
